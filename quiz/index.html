<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stewardship Quiz | Climate Color</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ADLaM+Display&family=Varela+Round&display=swap" rel="stylesheet">

    <!-- Paths adjusted to match your actual nested repo structure -->
    <link rel="stylesheet" href="../css/atlas.css">
    <link rel="stylesheet" href="css/quiz.css">
    <link rel="stylesheet" href="css/results.css">
</head>
<body>
    <!-- Header -->
    <header class="quiz-header">
        <div>
            <h1>The Quiz</h1>
            <p>a <strong>self-assessment tool</strong> that helps you find <strong>your place</strong> in the climate movement</p>
        </div>
    </header>

    <!-- Action Bar -->
    <div class="beta-banner">
        <div style="display: flex; gap: 0.75rem; align-items: center;" id="bannerActions">
        <a href="quiz-faq.html" class="btn-sm-action" style="text-decoration: none;">FAQ</a>
        </div>
    </div>

    <!-- Main Quiz Card Container -->
<main id="quiz">

    <!-- Updated 2026-09-22 for the normative rewrite: 40 independent items
         (was 16 paired-choice items), each answered on its own with the
         Probably not / Maybe / Probably yes scale (was "pick one of four
         options"). If quiz-faq.html also describes the old format/count,
         it needs the same update. -->
    <p id="quizInstructions" class="text-muted" style="margin-bottom: 1.25rem;">
        You'll move through 40 quick, everyday situations. For each one, choose Probably not, Maybe, or Probably yes, whatever feels most true for you. There's no right or wrong answer.
    </p>

    <!-- Progress & Status Indicator (moved here) -->
    <div class="progress-info-bar">
        <span id="progressText">Question 1 of 40</span>
        <span id="progressPercent">0%</span>
    </div>

    <div class="progress-container" id="progressContainer" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="quiz-card" id="quizCard">
        <!-- Left empty (was a static "PACE AXIS" label): quiz-logic.js always
             overwrites this with "" on render anyway now that axes are
             retired, but the old hardcoded text would've flashed before JS
             ran. Element/id kept only because quiz-logic.js still targets
             #questionNumber — safe to remove entirely in a later pass. -->
        <div class="question-number" id="questionNumber"></div>
        <div class="question-text" id="questionText" tabindex="-1"></div>
        <div class="options-container" id="optionsContainer"></div>
    </div>

</main>

    <!-- Results Screen Container -->
    <div id="results" hidden></div>

    <!-- Script path adjusted to point into the js/ subdirectory -->
    <script type="module" src="js/quiz-logic.js"></script>
</body>
</html>
