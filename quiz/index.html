<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Climate Color Quiz</title>

  <!-- Core Styles -->
  <link rel="stylesheet" href="./css/atlas.css" />
  <link rel="stylesheet" href="./css/quiz.css" />
  <link rel="stylesheet" href="./css/results.css" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

  <!-- QUIZ CARD -->
  <div id="quizCard" class="quizCard">

    <!-- Progress Bar -->
    <div id="progressContainer" class="progressContainer" aria-valuemin="0" aria-valuemax="100">
      <div id="progressBar" class="progressBar"></div>
    </div>

    <!-- Question Number -->
    <div id="questionNumber" class="questionNumber"></div>

    <!-- Question Text -->
    <div id="questionText" class="questionText"></div>

    <!-- Options -->
    <div id="optionsContainer" class="optionsContainer"></div>
  </div>

  <!-- RESULTS -->
  <div id="resultContainer" class="resultContainer" style="display:none;"></div>

  <!-- LOGIC -->
  <script type="module" src="./js/quiz-logic.js"></script>

</body>
</html>
