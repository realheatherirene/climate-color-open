<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stewardship Quiz | Climate Color</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ADLaM+Display&family=Varela+Round&display=swap" rel="stylesheet">
    
    <!-- Corrected path to step out of quiz folder -->
    <link rel="stylesheet" href="../css/atlas.css">
    <link rel="stylesheet" href="quiz.css">
    <link rel="stylesheet" href="results.css">
</head>
<body>

    <!-- Beta Banner -->
    <div class="beta-banner">
        <span>What's your stewardship style?</span>
        <div style="display: flex; gap: 0.5rem; align-items: center;">
            <a href="https://climatecolor.com/quiz-faq" class="beta-tag" style="text-decoration: none;">FAQ</a>
            <span class="beta-tag">Beta</span>
        </div>
    </div>

    <!-- Header -->
    <header class="quiz-header">
        <div>
            <h1>The Quiz</h1>
            <p>Discover your stewardship style-your role in climate action.</p>
        </div>
    </header>

    <!-- Optimized Progress & Status Indicator -->
    <div class="progress-info-bar">
        <span id="progressText">Question 1 of 16</span>
        <span id="progressPercent">0%</span>
    </div>
    <div class="progress-container" id="progressContainer" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Main Quiz Card Container -->
    <main id="quiz">
        <div class="quiz-card" id="quizCard">
            <div class="question-number" id="questionNumber">PACE AXIS</div>
            <div class="question-text" id="questionText" tabindex="-1"></div>
            <div class="options-container" id="optionsContainer"></div>
        </div>
    </main>

    <!-- Results Screen Container -->
    <div id="results" hidden></div>

    <script type="module" src="quiz-logic.js"></script>
</body>
</html>
