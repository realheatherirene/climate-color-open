<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climate Color Stewardship Quiz</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    
    <!-- Stylesheets -->
    <!-- atlas.css is in the root css/ folder, so go up one level (../) -->
    <link rel="stylesheet" href="../css/atlas.css">
    
    <!-- quiz.css and results.css are in quiz/css/ -->
    <link rel="stylesheet" href="css/quiz.css">
    <link rel="stylesheet" href="css/results.css">
</head>
<body>

    <!-- Beta Banner -->
    <div class="beta-banner">
        <span>Climate Color Stewardship Quiz</span>
        <span class="beta-tag">Beta</span>
    </div>

    <!-- Header Styles -->
    <header class="quiz-header">
        <h1>Climate Color Quiz</h1>
        <p>Discover your primary and secondary stewardship styles.</p>
    </header>

    <!-- Progress Bar -->
    <div class="progress-container" id="progressContainer" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Intro Screen -->
    <div id="intro">
        <button id="begin-btn" class="option-btn btn-sm-primary" style="text-align: center; font-weight: 700; margin-bottom: 2rem;">Begin Quiz</button>
    </div>

    <!-- Main Quiz Card Container -->
    <main id="quiz" hidden>
        <div class="quiz-card" id="quizCard">
            <div class="question-number" id="questionNumber"></div>
            <div class="question-text" id="questionText" tabindex="-1"></div>
            <div class="options-container" id="optionsContainer"></div>
        </div>
    </main>

    <!-- Results Screen Container -->
    <div id="results" hidden></div>

    <!-- Application Entry Point (in quiz/js/) -->
    <script type="module" src="js/ui.js"></script>
</body>
</html>
