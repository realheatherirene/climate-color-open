function renderQuestion() {
    const q = questions[currentQuestion];
    document.getElementById("questionNumber").textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
    document.getElementById("questionText").textContent = q.text;
    
    const pct = questions.length > 0 ? (currentQuestion / questions.length) * 100 : 0;
    updateProgressBar(pct);

    const container = document.getElementById("optionsContainer");
    container.innerHTML = "";
    q.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = opt.text;
        btn.onclick = () => selectOption(opt.style);
        container.appendChild(btn);
    });
}

function selectOption(styleKey) {
    scores[styleKey]++;
    currentQuestion++;
    if (currentQuestion < questions.length) {
        renderQuestion();
    } else {
        calculateResults();
    }
}

function calculateResults() {
    updateProgressBar(100);
    document.getElementById("quizCard").style.display = "none";

    const axes = [
        { anchor: "PACE", poleA: "Driver", poleB: "Stabilizer" },
        { anchor: "PEOPLE", poleA: "Advocate", poleB: "Connector" },
        { anchor: "PLACE", poleA: "Architect", poleB: "Guardian" },
        { anchor: "PURPOSE", poleA: "Visionary", poleB: "Keeper" }
    ];

    const axisWinners = axes.map(axis => {
        const scoreA = scores[axis.poleA];
        const scoreB = scores[axis.poleB];
        return { 
            anchor: axis.anchor, 
            winner: scoreA >= scoreB ? axis.poleA : axis.poleB, 
            winningScore: Math.max(scoreA, scoreB), 
            margin: Math.abs(scoreA - scoreB) 
        };
    });

    axisWinners.sort((a, b) => (b.winningScore !== a.winningScore) ? b.winningScore - a.winningScore : b.margin - a.margin);

    const primaryKey = axisWinners[0].winner;
    let secondaryKey = axisWinners[1].winner;
    
    // Prevent Primary and Secondary duplicate selection
    if (secondaryKey === primaryKey) {
        const alt = axisWinners.find(w => w.winner !== primaryKey);
        secondaryKey = alt ? alt.winner : (primaryKey === "Driver" ? "Stabilizer" : "Driver");
    }

    localStorage.setItem('climatecolor_primary', primaryKey);
    localStorage.setItem('climatecolor_secondary', secondaryKey);

    const url = new URL(window.location);
    url.searchParams.set('primary', primaryKey);
    url.searchParams.set('secondary', secondaryKey);
    window.history.pushState({}, '', url);

    renderReveal(primaryKey, secondaryKey);
}

function renderReveal(primaryKey, secondaryKey) {
    const primary = styles[primaryKey] || styles.Driver;
    const secondary = (styles[secondaryKey] && secondaryKey !== primaryKey) ? styles[secondaryKey] : (primaryKey === "Driver" ? styles.Stabilizer : styles.Driver);
    const actualSecondaryKey = (secondaryKey && secondaryKey !== primaryKey) ? secondaryKey : (primaryKey === "Driver" ? "Stabilizer" : "Driver");

    const synthesisText = secondarySyntheses[primaryKey]?.[actualSecondaryKey] || 
        `You bring a unique combination of ${primaryKey} initiative and ${actualSecondaryKey} perspective to community stewardship.`;

    const result = document.getElementById("resultContainer");
    result.style.display = "block";
    
    const encodedPrimary = encodeURIComponent(primaryKey);
    const encodedSecondary = encodeURIComponent(actualSecondaryKey);

    result.innerHTML = `
        <div class="sticky-results-bar">
            <div style="font-size: 0.85rem; font-weight: 700; color: #0F172A;">
                Results: <span style="color: ${primary.color};">${primaryKey}</span> / <span style="color: ${secondary.color};">${actualSecondaryKey}</span>
            </div>
            <div class="sticky-actions">
                <button onclick="window.print()" class="btn-sm-action btn-sm-primary">Print / Save PDF</button>
                <button onclick="copyQuizLink('${encodedPrimary}', '${encodedSecondary}')" class="btn-sm-action">Copy Link</button>
                <button onclick="resetQuiz()" class="btn-sm-action">Retake</button>
            </div>
        </div>

        <div class="styleBlock" style="border-left-color: ${primary.color};">
            <div class="styleTitle" style="color: #1E293B; font-size: 1.35rem; margin-bottom: 0.25rem;">
                ${primaryKey}
            </div>
            <div class="styleIdentity">${primary.identity}</div>
            <div style="font-size: 0.85rem; font-weight: 700; color: #64748B; text-transform: uppercase; margin-bottom: 0.85rem;">
                Anchor: ${primary.anchor} &nbsp;|&nbsp; Energy: ${primary.energy}
            </div>
            <div style="margin-bottom: 0.75rem; color: #334155;"><strong>How You Contribute:</strong> ${primary.contribution}</div>
            <div class="styleAction"><strong>Where You Shine:</strong> ${primary.shine}</div>
            <div style="font-size: 0.88rem; color: #64748B; font-style: italic; margin-bottom: 1rem;"><strong>Watchouts:</strong> ${primary.watchouts}</div>
            <div class="cta-container">
                <a href="directory.html?style=${encodedPrimary}" class="btn-pill-soft" style="background-color: rgba(${primary.rgb}, 0.08); border-color: rgba(${primary.rgb}, 0.25); color: ${primary.color} !important;">
                    Explore ${primaryKey} Actions &rarr;
                </a>
            </div>
        </div>

        <div class="styleBlock" style="border-left-color: ${secondary.color};">
            <div class="styleTitle" style="color: #1E293B; font-size: 1.15rem; margin-bottom: 0.25rem;">
                Secondary: ${actualSecondaryKey}
            </div>
            <div class="styleIdentity" style="font-size: 0.98rem;">${secondary.identity}</div>
            <div style="font-size: 0.8rem; font-weight: 700; color: #64748B; text-transform: uppercase; margin-bottom: 0.85rem;">
                Anchor: ${secondary.anchor} &nbsp;|&nbsp; Energy: ${secondary.energy}
            </div>
            <div style="margin-bottom: 0.75rem; color: #334155; font-size: 0.92rem;"><strong>How You Contribute:</strong> ${secondary.contribution}</div>
            <div class="styleAction" style="font-size: 0.9rem;"><strong>Where You Shine:</strong> ${secondary.shine}</div>
            <div style="font-size: 0.85rem; color: #64748B; font-style: italic; margin-bottom: 1rem;"><strong>Watchouts:</strong> ${secondary.watchouts}</div>
            <div class="cta-container">
                <a href="directory.html?style=${encodedSecondary}" class="btn-pill-soft" style="background-color: rgba(${secondary.rgb}, 0.08); border-color: rgba(${secondary.rgb}, 0.25); color: ${secondary.color} !important;">
                    Explore ${actualSecondaryKey} Actions &rarr;
                </a>
            </div>
        </div>

        <div class="styleBlock" style="border-left-color: ${primary.color}; background: #F8FAFC; border-color: #E2E8F0; border-left-width: 6px;">
            <div class="styleTitle" style="color: #1E293B; font-size: 1.25rem; margin-bottom: 0.5rem;">How Your Styles Work Together</div>
            <div style="font-size: 0.98rem; color: #334155; line-height: 1.6;">${synthesisText}</div>
        </div>
    `;
}

window.copyQuizLink = function(primaryKey, secondaryKey) {
    const shareUrl = `${window.location.origin}${window.location.pathname}?primary=${encodeURIComponent(primaryKey)}&secondary=${encodeURIComponent(secondaryKey)}`;
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareUrl)
            .then(() => alert("Link copied to clipboard! You can paste or bookmark this URL to return to your results anytime."))
            .catch(() => prompt("Copy your share link below:", shareUrl));
    } else {
        prompt("Copy your share link below:", shareUrl);
    }
};

window.resetQuiz = function() {
    localStorage.removeItem('climatecolor_primary');
    localStorage.removeItem('climatecolor_secondary');
    window.location.href = window.location.pathname;
};

function initQuizState() {
    const urlParams = new URLSearchParams(window.location.search);
    const paramPrimary = urlParams.get('primary');
    const paramSecondary = urlParams.get('secondary');

    const validPrimary = (paramPrimary && styles[paramPrimary]) ? paramPrimary : 
                         (localStorage.getItem('climatecolor_primary') && styles[localStorage.getItem('climatecolor_primary')]) ? localStorage.getItem('climatecolor_primary') : null;

    let validSecondary = (paramSecondary && styles[paramSecondary]) ? paramSecondary : 
                           (localStorage.getItem('climatecolor_secondary') && styles[localStorage.getItem('climatecolor_secondary')]) ? localStorage.getItem('climatecolor_secondary') : null;

    if (validPrimary && validSecondary && validPrimary === validSecondary) {
        validSecondary = validPrimary === "Driver" ? "Stabilizer" : "Driver";
    }

    if (validPrimary) {
        updateProgressBar(100);
        document.getElementById("quizCard").style.display = "none";
        renderReveal(validPrimary, validSecondary || (validPrimary === "Driver" ? "Stabilizer" : "Driver"));
    } else {
        currentQuestion = 0;
        scores = { Driver: 0, Stabilizer: 0, Advocate: 0, Connector: 0, Architect: 0, Guardian: 0, Visionary: 0, Keeper: 0 };
        document.getElementById("resultContainer").style.display = "none";
        document.getElementById("quizCard").style.display = "block";
        renderQuestion();
    }
}

document.addEventListener("DOMContentLoaded", initQuizState);
window.addEventListener("popstate", initQuizState);
</script>
</body>
</html>
