<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Climate Stewardship Styles</title>

<style>
    body {
        font-family: system-ui, sans-serif;
        background: #f8fafc;
        color: #1e293b;
        margin: 0;
        padding: 0;
    }

    a {
        text-decoration: none;
    }

    .wrapper {
        max-width: 760px;
        margin: 2rem auto;
        padding: 1.5rem;
    }

    h1 {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 1rem;
    }

    .intro {
        color: #334155;
        font-size: 1rem;
        margin-bottom: 1.5rem;
    }

    .style-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 1.25rem;
        margin-top: 1.5rem;
    }

    .style-card {
        background: white;
        padding: 1.25rem;
        border-radius: 12px;
        border-left: 6px solid transparent;
        box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .style-card:hover,
    .style-card:focus-within {
        transform: translateY(-3px);
        box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        outline: none;
    }

    .style-name {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 0.35rem;
    }

    .style-identity {
        font-size: 0.95rem;
        color: #334155;
        margin-bottom: 0.75rem;
    }

    .btn-pill-soft {
        display: inline-block;
        padding: 0.55rem 0.9rem;
        border-radius: 999px;
        border: 1px solid #cbd5e1;
        background: #f1f5f9;
        font-weight: 600;
        color: #1e293b;
        transition: background 0.2s, border-color 0.2s;
    }

    .btn-pill-soft:hover,
    .btn-pill-soft:focus {
        background: #e2e8f0;
        outline: 2px solid #1494B8;
    }

    .cta-container {
        margin-top: 2rem;
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
    }
</style>
</head>

<body>
<div class="wrapper">

    <h1>Explore All Climate Stewardship Styles</h1>
    <p class="intro">
        Each stewardship style reflects a unique way of contributing to climate resilience.
        Choose a style below to explore its strengths, behaviors, and action pathways.
    </p>

    <div id="styleGrid" class="style-grid"></div>

    <div class="cta-container">
        <a href="quiz.html" class="btn-pill-soft">Take the Quiz</a>
        <a href="https://climatecolor.com/wheel" target="_blank" rel="noopener noreferrer"
           class="btn-pill-soft" style="color:#1494B8;">
            Climate Color Wheel →
        </a>
    </div>

</div>

<script type="module">
import { styles } from './directory-data.js';

function renderIndex() {
    const grid = document.getElementById("styleGrid");

    grid.innerHTML = Object.entries(styles).map(([key, data]) => `
        <div class="style-card" style="border-left-color:${data.color};">
            <div class="style-name" style="color:${data.color};">${key}</div>
            <div class="style-identity">${data.identity}</div>

            <a href="directory.html?style=${encodeURIComponent(key)}"
               class="btn-pill-soft"
               aria-label="Explore ${key} style details">
               Explore ${key} →
            </a>
        </div>
    `).join("");
}

document.addEventListener("DOMContentLoaded", renderIndex);
</script>

</body>
</html>
