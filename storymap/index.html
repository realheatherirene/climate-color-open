<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Story Map | Climate Color</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ADLaM+Display&family=Varela+Round&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../core/atlas.css">
    <link rel="stylesheet" href="../core/listing.css">
    <link rel="stylesheet" href="story-map.css">
</head>
<body>

    <header class="page-header">
        <h1>The Story Map</h1>
        <p>a collection of <strong>news</strong> and <strong>personal narratives</strong> sorted by <strong>climate color</strong></p>
    </header>

    <p id="draftNotice" class="draft-notice" hidden>Preview mode: draft stories are showing. Remove <strong>?drafts=1</strong> from the address to see the public page.</p>

    <div class="search-bar">
        <input id="searchInput" class="search-input" type="search" placeholder="Search stories or places…" aria-label="Search stories or places">
    </div>

    <div class="filter-pills" id="pillContainer" role="group" aria-label="Show stories for these colors"></div>

    <div class="story-map-frame">
        <svg id="storyMap" role="group" aria-label="World map of stories. Select a pin to jump to its story."></svg>
    </div>
    <p id="storyCount" class="story-count" aria-live="polite"></p>

    <div class="listing-grid" id="storyContainer"></div>

    <script type="module" src="story-map-logic.js"></script>
</body>
</html>
