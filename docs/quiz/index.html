<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Climate Stewardship Quiz | Climate Color</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=ADLaM+Display&family=Varela+Round&display=swap" rel="stylesheet">

<!-- Stylesheets -->
<link rel="stylesheet" href="./css/atlas.css">
<link rel="stylesheet" href="./css/quiz.css">
<link rel="stylesheet" href="./css/results.css">

<body>

<!-- Beta Banner -->
<div class="beta-banner">
    <div>
        <span class="beta-tag">Active Beta</span>
        You are viewing an early preview of the Climate Color assessment engine.
    </div>
    <div>
        <a href="mailto:hello@climatecolor.com?subject=Beta%20Feedback"
           style="color: #1494B9; font-weight: 700; text-decoration: underline;">
           Share Feedback
        </a>
    </div>

<header class="quiz-header">

    <div id="optionsContainer" class="options-container"></div>
</main>

<!-- Results Container -->
<div id="resultContainer" style="display: none;" aria-live="polite"></div>

<script type="module" src="./js/quiz-logic.js"></script>
