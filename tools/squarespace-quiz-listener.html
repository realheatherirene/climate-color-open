<!-- ==========================================================================
     Climate Color: Squarespace listener for the embedded quiz
     ==========================================================================
     This is a copy for safekeeping. The live copy is pasted into
     Squarespace: Settings > Advanced > Code Injection > Footer.

     It is the second half of a pair. quiz/js/iframe-resize.js (inside the
     quiz) keeps reporting how tall the quiz is; this script hears that and
     sets the quiz's box on the Squarespace page to the same height, so the
     quiz is never cut off and never leaves a big gap.

     It only acts on messages tagged "climate-color-quiz" that come from a
     frame on the page, and it only ever changes that frame's height.
     ========================================================================== -->
<script>
window.addEventListener("message", function (e) {
  var d = e.data;
  if (!d || d.source !== "climate-color-quiz" || typeof d.height !== "number") return;
  var frames = document.getElementsByTagName("iframe");
  for (var i = 0; i < frames.length; i++) {
    if (frames[i].contentWindow === e.source) {
      frames[i].style.height = Math.ceil(d.height) + "px";
      frames[i].setAttribute("scrolling", "no");
      break;
    }
  }
});
</script>
