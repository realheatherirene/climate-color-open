<!-- ==========================================================================
     Climate Color: Squarespace helper that passes ?style= into the embeds
     ==========================================================================
     A copy for reference. The live copy sits in the Code Block that holds
     each page's embed, right after the closing </iframe> tag, on the three
     pages that use colors in their address: Pathways, Directory, and Story
     Map. Don't put it in Page Settings > Advanced: code there runs before
     the embed exists, so it finds nothing to update. Squarespace doesn't
     run scripts in the editor, so test it on the live page in a private
     window.

     Links like climatecolor.com/directory?style=Blue,Green open a
     Squarespace page, and the Directory inside it is an embedded box with
     its own address, which doesn't know about the colors. This script
     copies ?style= from the page's address onto every Climate Color box on
     the page (any iframe whose address contains /climate-color-open/, the
     repo's name), so the Directory and Story Map open already filtered,
     and the Pathways page opens the one color named. With no ?style= in
     the address it does nothing.
     ========================================================================== -->
<script>
(function () {
  var style = new URLSearchParams(window.location.search).get("style");
  if (!style) return;
  var frames = document.getElementsByTagName("iframe");
  for (var i = 0; i < frames.length; i++) {
    var src = frames[i].getAttribute("src") || "";
    if (src.indexOf("/climate-color-open/") === -1) continue;
    var url = new URL(src, window.location.href);
    url.searchParams.set("style", style);
    frames[i].src = url.href.replace(/%2C/g, ",");
  }
})();
</script>
