<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stewardship Wheel Quiz</title>

<!-- ============================
     CLEAN, MAINTAINABLE CSS
============================= -->
<style>
    body {
        font-family: system-ui, sans-serif;
        background: #f8fafc;
        color: #1e293b;
        margin: 0;
        padding: 0;
    }
<header class="site-header">
    <div class="header-inner">
        <a href="index.html" class="site-title">Climate Stewardship Wheel</a>

        <nav class="site-nav">
            <a href="quiz.html">Quiz</a>
            <a href="index.html">All Styles</a>
            <a href="https://climatecolor.com/wheel" target="_blank" rel="noopener">Wheel</a>
        </nav>
    </div>
</header>

    .quiz-wrapper {
        max-width: 720px;
        margin: 2rem auto;
        padding: 1.5rem;
    }

    .progress-container {
        background: #e2e8f0;
        height: 10px;
        border-radius: 6px;
        overflow: hidden;
        margin-bottom: 1.5rem;
    }

    .progress-bar {
        height: 10px;
        width: 0%;
        background: #1494B8;
        transition: width 0.3s ease;
    }

    .quiz-card {
        background: white;
        padding: 1.5rem;
        border-radius: 12px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    .option-btn {
        display: block;
        width: 100%;
        margin: 0.5rem 0;
        padding: 0.85rem 1rem;
        border-radius: 10px;
        border: 1px solid #cbd5e1;
        background: #f1f5f9;
        font-size: 1rem;
        text-align: left;
        cursor: pointer;
        transition: background 0.2s;
    }

    .option-btn:hover,
    .option-btn:focus {
        background: #e2e8f0;
        outline: 2px solid #1494B8;
    }

    .result-container {
        display: none;
        margin-top: 2rem;
    }

    .style-block {
        background: white;
        padding: 1.25rem;
        border-radius: 12px;
        border-left: 6px solid transparent;
        margin-bottom: 1.5rem;
        box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    .style-title {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 0.35rem;
    }

    .style-identity {
        font-size: 1rem;
        margin-bottom: 0.5rem;
    }

    .style-action {
        margin-top: 0.75rem;
        font-weight: 500;
    }

    .cta-container {
        margin-top: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    .btn-pill-soft {
        display: inline-block;
        padding: 0.65rem 1rem;
        border-radius: 999px;
        border: 1px solid transparent;
        text-decoration: none;
        font-weight: 600;
        transition: background 0.2s, border-color 0.2s;
    }

    .btn-pill-soft:hover {
        background: rgba(0,0,0,0.06);
    }

    .muted {
        color: #334155;
    }
</style>
</head>

<body>
<div class="quiz-wrapper">

    <!-- Progress Bar -->
    <div class="progress-container">
        <div id="progressBar" class="progress-bar" role="progressbar"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
    </div>

    <!-- Quiz Card -->
    <div id="quizCard" class="quiz-card">
        <h2 id="questionTitle"></h2>
        <div id="optionsContainer"></div>
    </div>

    <!-- Results -->
    <div id="resultContainer" class="result-container" tabindex="-1"></div>

</div>

<!-- ============================
     CLEAN, CORRECTED JAVASCRIPT
============================= -->
<script type="module">
import { styles } from './directory-data.js?v=1';

let currentQuestion = 0;
let selectedAudience = 'individual';
const scores = {};
const selectionHistory = [];

// Initialize score trackers
Object.keys(styles).forEach(style => scores[style] = 0);

// Render a question
function renderQuestion() {
    const q = questions[currentQuestion];
    if (!q) return;

    document.getElementById("questionTitle").textContent =
        `${currentQuestion + 1}. ${q.getPrompt(selectedAudience)}`;

    const container = document.getElementById("optionsContainer");
    container.innerHTML = "";

    q.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option-btn";
        btn.textContent = opt.text;

        // Accessibility
        btn.setAttribute("aria-label", `${opt.text} (${opt.style})`);

        btn.onclick = () => selectOption(opt.style);
        container.appendChild(btn);
    });

    // Correct progress bar
    const progressPct = Math.round(((currentQuestion + 1) / questions.length) * 100);
    const progressBar = document.getElementById("progressBar");
    progressBar.style.width = `${progressPct}%`;
    progressBar.setAttribute("aria-valuenow", progressPct);
    progressBar.setAttribute("aria-valuetext", `${progressPct}% complete`);
}

// Handle selection
function selectOption(styleKey) {
    scores[styleKey]++;
    selectionHistory.push(styleKey);

    currentQuestion++;

    if (currentQuestion < questions.length) {
        renderQuestion();
    } else {
        calculateResults();
    }
}

// Calculate results
function calculateResults() {
    const progressBar = document.getElementById("progressBar");
    progressBar.style.width = "100%";
    progressBar.setAttribute("aria-valuenow", 100);

    document.getElementById("quizCard").style.display = "none";

    // Tie-breaker logic
    const sorted = Object.entries(scores).sort((a, b) => {
        if (b[1] !== a[1]) return b[1] - a[1];
        if (b[1] === 0 && a[1] > 0) return -1;
        if (a[1] === 0 && b[1] > 0) return 1;
        return selectionHistory.lastIndexOf(b[0]) -
               selectionHistory.lastIndexOf(a[0]);
    });

    const primaryKey = sorted[0][0];
    const secondaryKey = sorted[1] && sorted[1][1] > 0
        ? sorted[1][0]
        : primaryKey;

    const primary = styles[primaryKey];
    const secondary = styles[secondaryKey];

    const result = document.getElementById("resultContainer");
    result.style.display = "block";

    result.innerHTML = `
        <div class="style-block" style="border-left-color:${primary.color}">
            <div class="style-title">
                Your primary style: <span style="color:${primary.color}">${primaryKey}</span>
            </div>
            <div class="style-identity">${primary.identity}</div>
            <div class="muted">${primary.behavior}</div>
            <div class="style-action">${primary.action}</div>

            <div class="cta-container">
                <a href="https://climatecolor.com/${primary.color}" 
                   class="btn-pill-soft" style="color:${primary.color}">
                   Explore ${primaryKey} Climate Strengths →
                </a>
                <a href="directory.html?style=${encodeURIComponent(primaryKey)}"
                   class="btn-pill-soft" style="color:${primary.color}">
                   Explore ${primaryKey} Climate Actions →
                </a>
            </div>
        </div>

        <div class="style-block" style="border-left-color:${secondary.color}">
            <div class="style-title">
                Secondary alignment: <span style="color:${secondary.color}">${secondaryKey}</span>
            </div>
            <div class="style-identity">${secondary.identity}</div>
            <div class="muted">${secondary.behavior}</div>

            <div class="cta-container">
                <a href="https://climatecolor.com/${secondary.color}" 
                   class="btn-pill-soft" style="color:${secondary.color}">
                   Explore ${secondaryKey} Climate Strengths →
                </a>
                <a href="directory.html?style=${encodeURIComponent(secondaryKey)}"
                   class="btn-pill-soft" style="color:${secondary.color}">
                   Explore ${secondaryKey} Climate Actions →
                </a>
            </div>
        </div>

        <p class="muted">
            View how your styles connect on the
            <a href="https://climatecolor.com/wheel" style="color:#1494B8; font-weight:600;">
                Climate Color Wheel
            </a>.
        </p>
    `;

    result.focus();
}

// Detect audience mode
document.addEventListener("DOMContentLoaded", () => {
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode');

    if (['individual', 'workplace', 'student'].includes(mode)) {
        selectedAudience = mode;
    }

    renderQuestion();
});
</script>

</body>
</html>
