<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stewardship Style Quiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; line-height: 1.5; }
  h1 { margin-bottom: 0.5rem; }
  .intro { max-width: 700px; }
  .question { margin: 1.5rem 0; padding: 1rem; background: #f5f5f7; border-radius: 8px; }
  label { display: block; margin: 0.25rem 0; cursor: pointer; }
  button { margin-top: 1.5rem; padding: 0.6rem 1.2rem; font-size: 1rem;
           border-radius: 999px; border: none; background: #2563eb; color: white; }
  button:hover { background: #1d4ed8; }
  #result { margin-top: 1.5rem; padding: 1rem; background: #ecfeff; border-radius: 8px; }
</style>
</head>
<body>

<h1>Stewardship Style Quiz</h1>
<p class="intro">
  Everyone brings a different kind of care to the environmental conservation movement.
  This quiz helps you discover the strengths you naturally use—the ones that light your route to climate action.
</p>

<!-- QUESTIONS -->
<div id="quiz">
  <!-- Question blocks inserted here -->
</div>

<button onclick="calculateResults()">See My Stewardship Style</button>
<div id="result" style="display:none;"></div>

<script>
// Insert questions dynamically (cleaner than 10 giant blocks)
const questions = [
  ["When your friends are trying to make a plan and no one decides…",
    ["A","You speak up and suggest what to do next. (Driver)"],
    ["B","You encourage them and help them stay positive. (Advocate)"],
    ["C","You offer a new idea no one has thought of. (Visionary)"],
    ["D","You stay calm and help the group settle down. (Stabilizer)"],
    ["E","You organize the details so the plan works. (Architect)"],
    ["F","You remind people why the plan matters. (Keeper)"],
    ["G","You check to make sure everyone feels included. (Connector)"],
    ["H","You speak up if something feels unfair. (Guardian)"]
  ],
  ["When someone you care about is stressed…",
    ["A","You help them take the first step. (Driver)"],
    ["B","You cheer them up. (Advocate)"],
    ["C","You help them see the problem in a new way. (Visionary)"],
    ["D","You stay steady and calm with them. (Stabilizer)"],
    ["E","You help them sort things out. (Architect)"],
    ["F","You help them remember what’s important. (Keeper)"],
    ["G","You listen and help them feel understood. (Connector)"],
    ["H","You protect them from whatever is causing the stress. (Guardian)"]
  ],
  ["In a group project at school, work, or in your community, you usually…",
    ["A","Get things started when people stall. (Driver)"],
    ["B","Keep people motivated. (Advocate)"],
    ["C","Suggest creative ideas. (Visionary)"],
    ["D","Stick with the project and keep it going. (Stabilizer)"],
    ["E","Organize tasks and timelines. (Architect)"],
    ["F","Help the group stay focused on the goal. (Keeper)"],
    ["G","Help people work well together. (Connector)"],
    ["H","Step in when someone needs support or protection. (Guardian)"]
  ],
  ["When people you know are arguing…",
    ["A","You try to solve it quickly. (Driver)"],
    ["B","You help defuse tension with warmth and optimism. (Advocate)"],
    ["C","You help them see the problem differently. (Visionary)"],
    ["D","You stay calm and help others calm down. (Stabilizer)"],
    ["E","You explain what’s actually happening. (Architect)"],
    ["F","You remind people of shared values. (Keeper)"],
    ["G","You help people hear each other and find common ground. (Connector)"],
    ["H","You speak up if someone is being treated badly. (Guardian)"]
  ],
  ["When you walk into a new group or event…",
    ["A","You look for what needs to get started. (Driver)"],
    ["B","You look for ways to bring positive energy. (Advocate)"],
    ["C","You look for new ideas or possibilities. (Visionary)"],
    ["D","You look for what needs steady support. (Stabilizer)"],
    ["E","You look for how things are organized. (Architect)"],
    ["F","You look for what feels meaningful. (Keeper)"],
    ["G","You look for who might need connection. (Connector)"],
    ["H","You look for what seems at risk. (Guardian)"]
  ],
  ["When you’re part of a team, people count on you to…",
    ["A","Take action. (Driver)"],
    ["B","Encourage others. (Advocate)"],
    ["C","Think creatively. (Visionary)"],
    ["D","Stay steady. (Stabilizer)"],
    ["E","Organize things. (Architect)"],
    ["F","Keep the purpose clear. (Keeper)"],
    ["G","Build relationships. (Connector)"],
    ["H","Hold boundaries. (Guardian)"]
  ],
  ["When you care about something…",
    ["A","You act on it. (Driver)"],
    ["B","You talk about it and share your excitement. (Advocate)"],
    ["C","You imagine new ways to approach it. (Visionary)"],
    ["D","You show up regularly to nurture and maintain it. (Stabilizer)"],
    ["E","You make a plan. (Architect)"],
    ["F","You honor its importance and ensure its values are preserved. (Keeper)"],
    ["G","You bring people together around it. (Connector)"],
    ["H","You stand up and defend it when it's under threat. (Guardian)"]
  ],
  ["When someone asks for help…",
    ["A","You help them start. (Driver)"],
    ["B","You encourage them. (Advocate)"],
    ["C","You help them think in a new way. (Visionary)"],
    ["D","You help them stay calm. (Stabilizer)"],
    ["E","You help them organize. (Architect)"],
    ["F","You help them remember what matters. (Keeper)"],
    ["G","You help them feel supported. (Connector)"],
    ["H","You help them stay safe. (Guardian)"]
  ],
  ["When you notice something going wrong…",
    ["A","You step up immediately to redirect and get things back on track. (Driver)"],
    ["B","You encourage people to keep going. (Advocate)"],
    ["C","You rethink the approach. (Visionary)"],
    ["D","You steady the situation. (Stabilizer)"],
    ["E","You sort out the details. (Architect)"],
    ["F","You focus on what’s important. (Keeper)"],
    ["G","You check on people’s feelings. (Connector)"],
    ["H","You protect what’s being harmed. (Guardian)"]
  ],
  ["When you imagine your best self in a group…",
    ["A","You get things moving. (Driver)"],
    ["B","You inspire others. (Advocate)"],
    ["C","You imagine new possibilities. (Visionary)"],
    ["D","You keep things steady. (Stabilizer)"],
    ["E","You organize the system. (Architect)"],
    ["F","You protect meaning. (Keeper)"],
    ["G","You build connections. (Connector)"],
    ["H","You guard what’s vulnerable. (Guardian)"]
  ]
];

// Render questions
const quizDiv = document.getElementById("quiz");
questions.forEach((q, i) => {
  const block = document.createElement("div");
  block.className = "question";
  block.innerHTML = `<p>${i+1}. ${q[0]}</p>` +
    q.slice(1).map(ans =>
      `<label><input type="radio" name="q${i+1}" value="${ans[0]}"> ${ans[1]}</label>`
    ).join("");
  quizDiv.appendChild(block);
});

// Scoring
function calculateResults() {
  const scores = {A:0,B:0,C:0,D:0,E:0,F:0,G:0,H:0};

  for (let i = 1; i <= 10; i++) {
    const ans = document.querySelector(`input[name="q${i}"]:checked`);
    if (ans) scores[ans.value]++;
  }

  const answered = Object.values(scores).reduce((a,b)=>a+b,0);
  if (answered < 10) { alert("Please answer all 10 questions."); return; }

  const sorted = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  const primary = sorted[0];
  const secondary = sorted[1];

  const names = {
    A:"Driver", B:"Advocate", C:"Visionary", D:"Stabilizer",
    E:"Architect", F:"Keeper", G:"Connector", H:"Guardian"
  };

  const result = document.getElementById("result");
  result.style.display = "block";
  result.innerHTML = `
    <h2>Your Stewardship Style</h2>
    <p>Your primary style is <strong>${names[primary[0]]}</strong> (${primary[1]} selections).</p>
    <p>Your supporting style is <strong>${names[secondary[0]]}</strong> (${secondary[1]} selections).</p>
    <p><a href="https://climatecolor.com/wheel" target="_blank">Learn more →</a></p>
  `;
}
</script>

</body>
</html>
