<script type="module">
import { questions, styles, secondarySyntheses, combinedPatterns } from './quiz-data.js';

let currentQuestion = 0;
const scores = {};
const typeCountsByStyle = {};

// 1. Initialize scoring matrices
Object.keys(styles).forEach(style => { 
  scores[style] = 0;
  typeCountsByStyle[style] = { relational: 0, clarity: 0, momentum: 0, meaning: 0, insight: 0 };
});

function renderQuestion() {
  const card = document.getElementById("quizCard");
  if (!questions[currentQuestion]) return;
  
  const q = questions[currentQuestion];
  document.getElementById("questionTitle").textContent = `${currentQuestion + 1}. ${q.prompt}`;
  
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  
  q.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "option-btn";
    btn.textContent = opt.text;
    btn.onclick = () => selectOption(opt.style, q.type);
    container.appendChild(btn);
  });
  
  const progressPct = Math.round((currentQuestion / questions.length) * 100);
  const progressBar = document.getElementById("progressBar");
  progressBar.style.width = `${progressPct}%`;
  progressBar.setAttribute("aria-valuenow", progressPct);
}

function selectOption(styleKey, questionType) {
  if (scores[styleKey] !== undefined) {
    scores[styleKey]++;
    typeCountsByStyle[styleKey][questionType]++;
  }
  currentQuestion++;
  if (currentQuestion < questions.length) {
    renderQuestion();
  } else {
    calculateResults();
  }
}

// 2. Multi-tier Tie-breaking Engine (as specified in logic documentation)
function breakTies(tiedStyles) {
  return tiedStyles.sort((a, b) => {
    const aTypes = typeCountsByStyle[a];
    const bTypes = typeCountsByStyle[b];

    // Priority 1: Relational frequency
    if (bTypes.relational !== aTypes.relational) return bTypes.relational - aTypes.relational;
    // Priority 2: Clarity/Structure frequency
    if (bTypes.clarity !== aTypes.clarity) return bTypes.clarity - aTypes.clarity;
    // Priority 3: Momentum/Energy frequency
    if (bTypes.momentum !== aTypes.momentum) return bTypes.momentum - aTypes.momentum;
    // Priority 4: Meaning/Purpose frequency
    if (bTypes.meaning !== aTypes.meaning) return bTypes.meaning - aTypes.meaning;
    
    return 0;
  });
}

function calculateResults() {
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("quizCard").style.display = "none";

  // Group styles by score
  const scoreMap = {};
  Object.entries(scores).forEach(([style, score]) => {
    if (!scoreMap[score]) scoreMap[score] = [];
    scoreMap[score].push(style);
  });

  const sortedScores = Object.keys(scoreMap).map(Number).sort((a, b) => b - a);

  let primaryKey = "";
  let secondaryKey = "";

  // Identify Primary Style
  const highestScore = sortedScores[0];
  const topTied = scoreMap[highestScore];

  if (topTied.length === 1) {
    primaryKey = topTied[0];
  } else {
    primaryKey = breakTies(topTied)[0];
  }

  // Identify Secondary Style
  if (topTied.length > 1) {
    // If there was a tie for 1st place, secondary comes from the remaining tied styles
    const remainingTop = topTied.filter(s => s !== primaryKey);
    secondaryKey = breakTies(remainingTop)[0];
  } else {
    // Otherwise, pick from the second-highest score group
    const secondHighestScore = sortedScores[1];
    if (secondHighestScore !== undefined) {
      const secondTied = scoreMap[secondHighestScore];
      secondaryKey = (secondTied.length === 1) ? secondTied[0] : breakTies(secondTied)[0];
    } else {
      secondaryKey = primaryKey;
    }
  }

  renderReveal(primaryKey, secondaryKey);
}

// 3. Render Results Profile Reveal Cards
function renderReveal(primaryKey, secondaryKey) {
  const primary = styles[primaryKey];
  const secondary = styles[secondaryKey] || primary;

  const synthesisText = secondarySyntheses[primaryKey]?.[secondaryKey] || 
    `Your secondary style of ${secondaryKey} supports and balances your primary ${primaryKey} strengths.`;
  
  const patternText = combinedPatterns[primaryKey]?.[secondaryKey] || 
    `You bring a unique combination of ${primaryKey} initiative and ${secondaryKey} perspective to community stewardship.`;

  const primaryBg = `rgba(${primary.rgb}, 0.08)`;
  const primaryBorder = `rgba(${primary.rgb}, 0.25)`;

  const result = document.getElementById("resultContainer");
  result.style.display = "block";
  result.innerHTML = `
    <!-- Primary Stewardship Reveal Card -->
    <div class="styleBlock" style="border-left-color: ${primary.color};">
      <div style="text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.08em; font-weight: 700; color: #64748B; margin-bottom: 0.25rem;">
        Primary Stewardship Style
      </div>
      <div class="styleTitle" style="font-size: 1.6rem; color: ${primary.color}; margin-bottom: 0.25rem;">
        ${primaryKey}
      </div>
      <div style="font-size: 0.85rem; font-weight: 700; color: #64748B; text-transform: uppercase; margin-bottom: 0.75rem;">
        Theme: ${primary.theme}
      </div>
      <div class="styleIdentity">${primary.identity}</div>
      <div style="margin-bottom: 0.85rem; color: #334155;">${primary.behavior}</div>
      <div class="styleAction" style="border-left: 3px solid ${primary.color}; padding-left: 0.75rem; margin-bottom: 0.85rem;">
        <strong>Where your gift shines:</strong> ${primary.action}
      </div>
      <div style="font-size: 0.88rem; color: #64748B; font-style: italic;">
        <strong>Gentle watchouts:</strong> ${primary.watchouts}
      </div>
    </div>

    <!-- Secondary Alignment Synthesis Card -->
    <div class="styleBlock" style="border-left-color: ${secondary.color};">
      <div style="text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.08em; font-weight: 700; color: #64748B; margin-bottom: 0.25rem;">
        Secondary Alignment
      </div>
      <div class="styleTitle" style="font-size: 1.3rem; color: ${secondary.color}; margin-bottom: 0.5rem;">
        ${primaryKey} + ${secondaryKey}
      </div>
      <div style="font-size: 0.95rem; color: #334155; margin-bottom: 0.75rem;">
        ${synthesisText}
      </div>
    </div>

    <!-- Emotional Payoff: Combined Pattern Card -->
    <div class="styleBlock" style="border-left-color: #0F172A; background: #F8FAFC;">
      <div style="text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.08em; font-weight: 700; color: #64748B; margin-bottom: 0.25rem;">
        Your Stewardship Pattern
      </div>
      <div style="font-size: 1.05rem; font-weight: 700; color: #0F172A; line-height: 1.5;">
        ${patternText}
      </div>
    </div>

    <!-- Soft CTA Action Area -->
    <div class="cta-container" style="margin-top: 1.5rem;">
      <a href="https://climatecolor.com/${primary.slug}" target="_blank" rel="noopener noreferrer" class="btn-pill-soft" style="background-color: ${primaryBg}; border-color: ${primaryBorder}; color: ${primary.color} !important;">
        Explore ${primaryKey} Strengths &rarr;
      </a>
      <a href="directory.html?style=${encodeURIComponent(primaryKey)}" class="btn-pill-soft" style="background-color: ${primaryBg}; border-color: ${primaryBorder}; color: ${primary.color} !important;">
        Explore ${primaryKey} Actions &rarr;
      </a>
    </div>

    <p style="margin-top: 1.5rem; text-align: left; font-size: 0.9rem; color: #64748B;">
      View how your primary and secondary styles connect on 
      <a href="https://climatecolor.com/wheel" target="_blank" rel="noopener noreferrer" style="color: #1494B8; font-weight: bold;">
        The Climate Color Wheel &rarr;
      </a>
    </p>
  `;
  result.focus();
}

document.addEventListener("DOMContentLoaded", () => {
  renderQuestion();
});
</script>
