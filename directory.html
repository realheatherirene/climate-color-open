<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Directory | Climate Color</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 1rem; }
.resource-card { border: 1px solid #ccc; padding: 1rem; margin-bottom: 1rem; border-left-width: 6px; }
.filter-container { margin-bottom: 1rem; }
</style>
</head>
<body>

<h1>Climate Color Directory</h1>

<div class="filter-container">
    <label for="styleFilter">Filter by Style: </label>
    <select id="styleFilter">
        <option value="All Styles">All Styles</option>
        <option value="Driver">Driver</option>
        <option value="Advocate">Advocate</option>
        <option value="Visionary">Visionary</option>
        <option value="Stabilizer">Stabilizer</option>
        <option value="Architect">Architect</option>
        <option value="Keeper">Keeper</option>
        <option value="Connector">Connector</option>
        <option value="Guardian">Guardian</option>
    </select>
</div>

<div id="directoryContainer"></div>

<script type="module">
import { styles, resources } from './directory-data.js';

const directoryContainer = document.getElementById('directoryContainer');
const styleFilter = document.getElementById('styleFilter');

function renderDirectory(selectedStyle = "All Styles") {
    directoryContainer.innerHTML = "";
    const filtered = resources.filter(res => {
        if (selectedStyle === "All Styles") return true;
        return res.styles.includes(selectedStyle);
    });

    filtered.forEach(item => {
        const primaryStyle = item.styles[0];
        const styleMeta = styles[primaryStyle] || { color: "#ccc" };
        
        const card = document.createElement('div');
        card.className = 'resource-card';
        card.style.borderLeftColor = styleMeta.color;
        
        card.innerHTML = `
            <h3><a href="${item.url}" target="_blank">${item.title}</a></h3>
            <p><strong>Type:</strong> ${item.type}</p>
            <p>${item.desc}</p>
            <p><strong>Styles:</strong> ${item.styles.join(", ")}</p>
        `;
        directoryContainer.appendChild(card);
    });
}

document.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const styleParam = urlParams.get('style');
    if (styleParam && styles[styleParam]) {
        styleFilter.value = styleParam;
        renderDirectory(styleParam);
    } else {
        renderDirectory("All Styles");
    }
});

styleFilter.addEventListener('change', (e) => {
    renderDirectory(e.target.value);
});
</script>
</body>
</html>
