<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Climate Stewardship Style Directory</title>

<!-- ============================
     CLEAN, MAINTAINABLE CSS
============================= -->
<style>
    body {
        font-family: system-ui, sans-serif;
        background: #f8fafc;
        color: #1e293b;
        margin: 0;
        padding: 0;
    }
<header class="site-header">
    <div class="header-inner">
        <a href="index.html" class="site-title">Climate Stewardship Wheel</a>

        <nav class="site-nav">
            <a href="quiz.html">Quiz</a>
            <a href="index.html">All Styles</a>
            <a href="https://climatecolor.com/wheel" target="_blank" rel="noopener">Wheel</a>
        </nav>
    </div>
</header>

    .wrapper {
        max-width: 760px;
        margin: 2rem auto;
        padding: 1.5rem;
    }

    .style-header {
        margin-bottom: 1.5rem;
    }

    .style-title {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 0.25rem;
    }

    .style-subtitle {
        font-size: 1.1rem;
        color: #334155;
        margin-bottom: 1rem;
    }

    .style-block {
        background: white;
        padding: 1.25rem;
        border-radius: 12px;
        border-left: 6px solid transparent;
        margin-bottom: 1.5rem;
        box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    .section-title {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
    }

    .muted {
        color: #334155;
    }

    .search-term-list {
        margin-top: 0.75rem;
        padding-left: 1.25rem;
    }

    .search-term-list li {
        margin-bottom: 0.35rem;
    }

    .cta-container {
        margin-top: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    .btn-pill-soft {
        display: inline-block;
        padding: 0.65rem 1rem;
        border-radius: 999px;
        border: 1px solid #cbd5e1;
        background: #f1f5f9;
        text-decoration: none;
        font-weight: 600;
        color: #1e293b;
        transition: background 0.2s, border-color 0.2s;
    }

    .btn-pill-soft:hover,
    .btn-pill-soft:focus {
        background: #e2e8f0;
        outline: 2px solid #1494B8;
    }

    .fallback {
        background: white;
        padding: 1.5rem;
        border-radius: 12px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        margin-top: 2rem;
    }
</style>
</head>

<body>
<div class="wrapper">

    <!-- Main Content -->
    <main id="directoryContent"></main>

</div>

<!-- ============================
     CLEAN, CORRECTED JAVASCRIPT
============================= -->
<script type="module">
import { styles } from './directory-data.js?v=1';

// Render directory page
function renderDirectory() {
    const urlParams = new URLSearchParams(window.location.search);
    const styleKey = urlParams.get('style');
    const content = document.getElementById("directoryContent");

    // Fallback UI for invalid or missing style
    if (!styleKey || !styles[styleKey]) {
        content.innerHTML = `
            <div class="fallback">
                <h1 style="margin-bottom: 0.75rem;">Style Not Found</h1>
                <p class="muted">The style you’re looking for doesn’t exist or wasn’t provided.</p>

                <div class="cta-container">
                    <a href="quiz.html" class="btn-pill-soft">Take the Quiz</a>
                    <a href="index.html" class="btn-pill-soft">View All Styles</a>
                </div>
            </div>
        `;
        return;
    }

    const data = styles[styleKey];

    content.innerHTML = `
        <header class="style-header">
            <h1 class="style-title" style="color:${data.color};">${styleKey}</h1>
            <p class="style-subtitle">${data.identity}</p>
        </header>

        <section class="style-block" style="border-left-color:${data.color};">
            <h2 class="section-title">Behavior</h2>
            <p class="muted">${data.behavior}</p>
        </section>

        <section class="style-block" style="border-left-color:${data.color};">
            <h2 class="section-title">Action Focus</h2>
            <p>${data.action}</p>
        </section>

        <section class="style-block" style="border-left-color:${data.color};">
            <h2 class="section-title">Suggested Search Terms</h2>
            <ul class="search-term-list">
                ${data.searchTerms.map(term => `<li>${term}</li>`).join("")}
            </ul>
        </section>

        <section class="style-block" style="border-left-color:${data.color};">
            <h2 class="section-title">Explore More</h2>
            <div class="cta-container">
                <a href="quiz.html" class="btn-pill-soft">Retake the Quiz</a>
                <a href="index.html" class="btn-pill-soft">View All Styles</a>
                <a href="https://climatecolor.com/wheel" target="_blank" rel="noopener noreferrer"
                   class="btn-pill-soft" style="color:${data.color};">
                    Climate Color Wheel →
                </a>
            </div>
        </section>
    `;
}

document.addEventListener("DOMContentLoaded", renderDirectory);
</script>

</body>
</html>
